name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: vocabulary reference is up to date
        run: afaa --vocabulary | diff - docs/vocabulary.md

  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . streamlit
      - run: python -m unittest tests.test_streamlit -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: cache Streamlit runtime downloads (Pyodide release, wheels)
        uses: actions/cache@v4
        with:
          path: web/.cache
          key: streamlit-runtime-${{ hashFiles('web/streamlit_build.py') }}
      - run: python3 build.py
      - name: browser tests
        run: |
          python3 build.py --serve --port 8000 &
          sleep 3
          SCREENSHOTS=screenshots node tests/e2e.mjs
          SCREENSHOTS=screenshots node tests/gui.mjs
          SCREENSHOTS=screenshots node tests/streamlit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-screenshots
          path: web/screenshots
          if-no-files-found: ignore
